<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Evolution - 接続用ページ</title>
<style>body{font-family:system-ui,sans-serif;background:#0b0b10;color:#eee;max-width:720px;margin:40px auto;padding:0 16px}
textarea{width:100%;height:120px;font-size:14px;background:#17171f;color:#fff;border:1px solid #444;border-radius:8px;padding:8px}
button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#ffd65a;cursor:pointer}.ok{color:#8f8}</style>
</head>
<body>
<h1>TikTok 接続用ページ</h1>
<p>このページの URL に認証コードが入っています。下のボタンでコピーして、Claude に貼ってください。</p>
<textarea id="u" readonly></textarea>
<p><button onclick="navigator.clipboard.writeText(document.getElementById('u').value).then(()=>{document.getElementById('m').textContent='コピーしました'})">URL をコピー</button> <span id="m" class="ok"></span></p>
<script>document.getElementById('u').value = location.href;</script>
</body>
</html>
